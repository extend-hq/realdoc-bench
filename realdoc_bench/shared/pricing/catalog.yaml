chandra_ocr:                    {unit: page,   usd: 0.0}
glm_ocr:                        {unit: page,   usd: 0.0}
elrnd_lunar_darkness:           {unit: page,   usd: 0.0}
elrnd_eternal_fog:              {unit: page,   usd: 0.0}

# VLMs invoked as layout processors: bill at token rates of their underlying model.
# Per-page conversion done by the caller via image+prompt token usage.
gemini_3_flash:                 {unit: tokens, input_usd_per_1k: 0.0006, output_usd_per_1k: 0.0024}
gemini_flash_lite:              {unit: tokens, input_usd_per_1k: 0.0003, output_usd_per_1k: 0.0012}
gemini_pro:                     {unit: tokens, input_usd_per_1k: 0.0050, output_usd_per_1k: 0.0200}

# ── Extraction agents (token billing) ───────────────────────────────────────
claude_sonnet_4_6:              {unit: tokens, input_usd_per_1k: 0.003,  output_usd_per_1k: 0.015}
claude_sonnet_4_7:              {unit: tokens, input_usd_per_1k: 0.003,  output_usd_per_1k: 0.015}
claude_opus_4_6:                {unit: tokens, input_usd_per_1k: 0.015,  output_usd_per_1k: 0.075}
