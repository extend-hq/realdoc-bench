[project]
name = "realdoc-bench"
version = "0.1.0"
description = "Document parsing benchmark for layout detection and downstream extraction quality."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Extend", email = "team@extend.app" }]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "huggingface_hub>=0.24",
    "boto3>=1.34",
    "azure-ai-documentintelligence>=1.0",
    "pymupdf>=1.24",
    "google-genai>=0.3",
    "openai>=1.40",
    "extend-ai>=0.10",
    "Pillow>=10.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "basedpyright>=1.13",
]

[project.scripts]
realdoc-bench = "realdoc_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realdoc_bench"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
